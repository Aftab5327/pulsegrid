# Mosquitto broker for DigiSpace local development.
#
# DEV ONLY — this broker is deliberately wide open: anonymous connections, no
# transport encryption. It is safe only because it is bound to localhost.
#
# TODO: before this runs anywhere other than a developer machine, switch to
# TLS + username/password:
#   - drop `allow_anonymous true` and add `password_file /mosquitto/config/passwd`
#     (generate with: mosquitto_passwd -c /mosquitto/config/passwd digispace)
#   - add `cafile`, `certfile`, `keyfile` to each listener and move them to
#     8883 (MQTT over TLS) and 8081 (WebSockets over TLS)
#   - set `require_certificate` if devices get client certs
# The backend and simulator both read their host/port from env vars, so that
# migration is a config change on this side, not a code change.

# Native MQTT — the backend and the device simulator connect here.
listener 1883
protocol mqtt

# MQTT over WebSockets — lets a browser talk to the broker directly, useful for
# debugging with a tool like MQTT Explorer. The dashboard does not use this; it
# gets its data from the FastAPI WebSocket instead.
listener 9001
protocol websockets

allow_anonymous true

# No on-disk queue: a dev broker should start clean every time, and retained
# state surviving a restart makes the simulator harder to reason about.
persistence false

# Log to stdout so `docker compose logs mosquitto` shows everything.
log_dest stdout
log_type all
